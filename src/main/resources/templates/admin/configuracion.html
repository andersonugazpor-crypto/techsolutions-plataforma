<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Configuración')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('admin')}"></aside>
    <main class="contenido">
        <header class="cabecera">
            <div>
                <h1>Configuración del sistema</h1>
                <p>Pasarelas de pago y política de precios.</p>
            </div>
        </header>
        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <div class="tarjeta">
            <h2>Pasarelas de pago</h2>
            <p class="suave">Las pasarelas deshabilitadas no aparecen al crear pedidos y no pueden cobrar.</p>
            <table>
                <thead><tr><th>Pasarela</th><th>Código</th><th>Dato requerido</th><th>Estado</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${pasarelas}">
                    <td><strong th:text="${p.nombre}"></strong></td>
                    <td th:text="${p.codigo}"></td>
                    <td th:text="${p.tipoContacto}"></td>
                    <td><span class="badge" th:classappend="${p.habilitada} ? 'ok' : 'mal'" th:text="${p.habilitada} ? 'Habilitada' : 'Deshabilitada'"></span></td>
                    <td>
                        <form method="post" th:action="@{/admin/pasarelas/{c}(c=${p.codigo})}">
                            <input type="hidden" name="habilitada" th:value="${!p.habilitada}">
                            <button class="btn pequeno" th:classappend="${p.habilitada} ? 'secundario' : 'exito'" type="submit"
                                    th:text="${p.habilitada} ? 'Deshabilitar' : 'Habilitar'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <form class="tarjeta" method="post" th:action="@{/admin/precios}">
            <h2>Estrategia de precios</h2>
            <div class="grilla g3">
                <label class="estrategia" th:each="e : ${estrategias}" th:classappend="${e.codigo() == estrategiaActiva.codigo()} ? 'activa'">
                    <input type="radio" name="estrategia" th:value="${e.codigo()}" th:checked="${e.codigo() == estrategiaActiva.codigo()}">
                    <strong th:text="${e.nombre()}"></strong>
                    <p class="suave" th:text="${e.descripcion()}"></p>
                </label>
            </div>
            <br>
            <div class="grilla g2">
                <div class="campo">
                    <label for="descuento">Porcentaje de descuento (estrategia “Descuento porcentual”)</label>
                    <input type="number" id="descuento" name="descuento" min="0" max="50" step="0.5" th:value="${parametros.porcentajeDescuento()}" required>
                </div>
                <div class="campo">
                    <label for="recargo">Recargo en temporada alta % (estrategia “Precio dinámico”)</label>
                    <input type="number" id="recargo" name="recargo" min="0" max="100" step="0.5" th:value="${parametros.recargoTemporadaAlta()}" required>
                    <div class="ayuda">Temporada alta: julio (Fiestas Patrias) y diciembre (Navidad).</div>
                </div>
            </div>
            <button class="btn" type="submit">Guardar estrategia</button>
        </form>
    </main>
</div>
</body>
</html>
