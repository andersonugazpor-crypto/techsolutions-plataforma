<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<div class="login-fondo">
    <div class="login-caja">
        <div class="marca">
            <span class="logo">TS</span>
            <div><strong>TechSolutions</strong><small>Plataforma de gestión empresarial</small></div>
        </div>
        <div class="alerta error" th:if="${error != null}" th:text="${error}">Error</div>
        <div class="alerta info" th:if="${param.salir != null}">Sesión cerrada correctamente.</div>
        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" th:value="${username}" autofocus required autocomplete="username">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" style="width:100%; justify-content:center">Ingresar</button>
        </form>
        <div class="demo">
            <strong>Usuarios de demostración</strong>
            <table>
                <tr><td>admin / admin123</td><td>Administrador</td></tr>
                <tr><td>gerente / gerente123</td><td>Gerente</td></tr>
                <tr><td>contador / contador123</td><td>Contador</td></tr>
                <tr><td>compras / compras123</td><td>Compras</td></tr>
                <tr><td>vendedor / vendedor123</td><td>Vendedor</td></tr>
            </table>
        </div>
    </div>
</div>
</body>
</html>
