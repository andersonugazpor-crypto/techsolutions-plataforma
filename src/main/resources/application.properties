spring.application.name=techsolutions-plataforma
server.port=8080
server.servlet.session.timeout=30m

# --- Base de datos por defecto: H2 en memoria (no requiere instalación) ---
spring.datasource.url=jdbc:h2:mem:techsolutions;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
logging.level.pe.techsolutions=INFO

# --- Parámetros de la plataforma ---
# Tiempo de vida (segundos) de la caché del Proxy de reportes
techsol.reportes.cache-segundos=60
# Tipo de cambio usado por el adaptador de PayPal (PEN -> USD)
techsol.pagos.tipo-cambio-usd=3.75
# Máximo de puntos de restauración (mementos) por pedido
techsol.pedidos.max-mementos=20
